const STAT_META = {

 {id:'warrior',name:'戰士',en:'WARRIOR',title:'不屈的鋒刃',hp:120,atk:18,def:6,crit:15,ult:25,color:'#c78d61',skill:'破軍斬',effect:'2.2 × ATK，扣除目標防禦',feature:'高生命、高防禦，穩定推進。',quote:'「命運不會讓路，那就斬開它。」'},

const round1=n=>Math.round((n+Number.EPSILON)*10)/10;
const bernoulli=p=>{const roll=Math.random();return {p,roll,success:roll<p};};
const uniform=(a,b)=>a+Math.random()*(b-a);
const getEnhanceSuccessRate=level=>[.95,.85,.75,.60,.45,.30,0][clamp(level,0,6)];
const makeCharacter=data=>({...data,maxHp:data.hp,baseHp:data.hp,levels:Object.fromEntries(STAT_KEYS.map(k=>[k,0]))});

function enhanceCharacter(character,key,stats){
 if(!STAT_KEYS.includes(key)||character.levels[key]>=6)return null;

 const amount=round1(uniform(...range)),field=key==='hp'?'maxHp':key,before=character[field];
 const min=key==='hp'?character.baseHp*.5:({atk:5,def:0,crit:5,ult:10}[key]);
 const max=['crit','ult'].includes(key)?60:Infinity;
 character[field]=clamp(round1(before+(trial.success?amount:-amount)),min,max);
 if(trial.success)character.levels[key]++;
 character.hp=character.maxHp;
 return {key,level,...trial,range,amount,before,after:character[field],delta:round1(character[field]-before)};
}
const calculateNormalDamage=(attacker,defender)=>Math.max(1,round1(attacker.atk-defender.def));
const rollUltimate=(character,stats)=>recordTrial(stats,'ult',bernoulli(character.ult/100));
const rollCritical=(character,stats)=>recordTrial(stats,'crit',bernoulli(character.crit/100));
function performUltimate(character,target){
 let hits=[],heal=0;
 if(character.mult)hits=[Math.round(character.mult*calculateNormalDamage(character,target))];
 else if(character.id==='assassin')hits=[1,2].map(()=>Math.round(Math.max(1,1.2*character.atk-target.def)));
 else {
 const mult={warrior:2.2,mage:2.6,paladin:1.6}[character.id];
 hits=[Math.round(Math.max(1,mult*character.atk-target.def*(character.id==='mage'?.5:1)))];
 if(character.id==='paladin'){
 const previous=character.hp;
 character.hp=Math.min(character.maxHp,round1(character.hp+round1(character.maxHp*.2)));
 heal=round1(character.hp-previous);
 }
 }
 return {hits,damage:hits.reduce((sum,x)=>sum+x,0),heal};
}
function performAttack(attacker,defender,stats){
 const ult=rollUltimate(attacker,stats);let crit=null,type='normal',result;
 if(ult.success){type='ult';result=performUltimate(attacker,defender);}
 else {crit=rollCritical(attacker,stats);type=crit.success?'crit':'normal';const damage=crit.success?Math.round(calculateNormalDamage(attacker,defender)*1.5):calculateNormalDamage(attacker,defender);result={damage,hits:[damage],heal:0};}
 defender.hp=Math.max(0,round1(defender.hp-result.damage));
 return {...result,type,ult,crit,skill:type==='ult'?attacker.skill:null};
}

 }).join('')}</div>${resultHtml()}<div class="prep-actions"><span class="sub-note">${state.ap===0?'能力點已用完，準備迎戰。':'準備好了？可隨時進入戰鬥。'}</span><button class="btn btn-primary" data-action="ready" ${state.busy?'disabled':''}>READY TO BATTLE <span class="arrow">→</span></button></div><div class="scout">${sigil(b.id)}<div><small>NEXT CHALLENGER · ${state.stage===4?'FINAL BOSS':'STAGE '+(state.stage+1)}</small><h3>${b.name} · ${b.title}</h3></div><div class="stats-inline">HP ${b.hp} · ATK ${b.atk} · DEF ${b.def}<br>CRIT ${b.crit}% · ULT ${b.ult}%</div></div></div></div></section>`;
}

function startRun(id){
 cancelRun();state.selected=id;state.player=makeCharacter(CLASSES.find(c=>c.id===id));state.boss=null;state.stage=0;state.ap=INITIAL_AP;state.stats=makeStats();state.bossStats=makeStats();state.logs=[];state.result=null;state.turn=0;state.speed=1;state.startedAt=Date.now();state.victory=false;go('prep');announce(`職業確認。獲得 ${INITIAL_AP} 點能力點。`);

function performEnhancement(stat){
 if(state.screen!=='prep'||state.busy||state.ap<=0||!STAT_KEYS.includes(stat)||state.player.levels[stat]>=6)return;
 state.busy=true;state.ap--;state.result=enhanceCharacter(state.player,stat,state.stats);renderPrep();
 const token=state.run;
 state.timer=setTimeout(()=>{if(token!==state.run||state.screen!=='prep')return;state.busy=false;renderPrep();const r=state.result;announce(`${STAT_META[stat].name}強化${r.success?'成功':'失敗'}，${statFormat(stat,r.before)}變為${statFormat(stat,r.after)}，剩餘${state.ap}點能力點。`);const target=app.querySelector(`[data-stat="${stat}"]`);if(target&&!target.disabled)target.focus({preventScroll:true});else app.querySelector('[data-action="ready"]').focus({preventScroll:true});},850);
}
function startBossBattle(stage){
 if(state.screen!=='prep'||state.busy)return;
 state.ap=0;state.stage=stage;state.player.hp=state.player.maxHp;state.boss=makeCharacter(BOSSES[stage]);state.logs=[];state.turn=0;state.playerTurn=true;go('battle');scheduleTurn(700);

 return `<div class="log-entry ${r.type}"><small><span>${actor}</span><span>#${log.turn}</span></small><h4>${r.type==='ult'?r.skill:r.type==='crit'?'CRITICAL · 爆擊':'NORMAL · 普通攻擊'} · ${format(r.damage)} 傷害${r.heal?' · 回復 '+format(r.heal):''}</h4><p>ULT ${percent(r.ult.p)} · Roll <b title="${r.ult.roll}">${r.ult.roll.toFixed(6)}</b> ${r.ult.success?'✓':'✕'}${r.crit?`<br>CRIT ${percent(r.crit.p)} · Roll <b title="${r.crit.roll}">${r.crit.roll.toFixed(6)}</b> ${r.crit.success?'✓':'✕'}`:'<br>大招已觸發，不進行爆擊判定。'}${r.hits.length>1?'<br>連擊：'+r.hits.join(' + ')+' 傷害':''}</p></div>`;

function updateHp(){for(const key of ['player','boss']){const c=state[key],el=document.getElementById(key+'-hp');el.setAttribute('aria-valuenow',c.hp);el.querySelector('.hp-fill').style.width=c.hp/c.maxHp*100+'%';document.getElementById(key+'-hp-label').textContent=`${format(c.hp)} / ${format(c.maxHp)}`;}}
function nextTurn(){
 if(state.screen!=='battle')return;
 if(modal.open){scheduleTurn(200);return;}
 if(state.player.hp<=0||state.boss.hp<=0){finishBossBattle();return;}
 const player=state.playerTurn,attacker=player?state.player:state.boss,defender=player?state.boss:state.player;
 const result=performAttack(attacker,defender,player?state.stats:state.bossStats);state.turn++;
 state.logs.unshift({player,turn:state.turn,result});state.logs=state.logs.slice(0,10);
 document.getElementById('log-body').innerHTML=state.logs.map(logHtml).join('');
 document.getElementById('turn-label').textContent=`${player?'PLAYER TURN · 你的回合':'BOSS TURN · 首領回合'} / ${String(state.turn).padStart(2,'0')}`;
 document.getElementById('combat-status').textContent=result.type==='ult'?`✦ ${attacker.skill} · ${format(result.damage)} 傷害`:result.type==='crit'?`CRITICAL HIT · ${format(result.damage)} 傷害`:`NORMAL ATTACK · ${format(result.damage)} 傷害`;
 const source=document.getElementById((player?'player':'boss')+'-fighter'),target=document.getElementById((player?'boss':'player')+'-fighter'),arena=document.getElementById('arena');
 document.querySelectorAll('.fighter').forEach(el=>el.classList.remove('attacking','hit'));arena.classList.remove('ultimate-flash','critical-flash');void arena.offsetWidth;
 source.classList.add('attacking');target.classList.add('hit');if(result.type!=='normal')arena.classList.add(result.type==='ult'?'ultimate-flash':'critical-flash');
 document.querySelectorAll('.damage-float').forEach(el=>el.remove());
 const damage=document.createElement('div');damage.className='damage-float '+result.type;damage.textContent='−'+format(result.damage);target.append(damage);
 if(result.heal){const popup=document.createElement('div');popup.className='damage-float';popup.style.top='65%';const heal=document.createElement('span');heal.className='heal-float';heal.textContent='回復 +'+format(result.heal);popup.append(heal);source.append(popup);}
 updateHp();announce(`${attacker.name}使用${result.type==='ult'?attacker.skill:result.type==='crit'?'爆擊':'普通攻擊'}，造成${format(result.damage)}點傷害。`);
 state.playerTurn=!state.playerTurn;
 const token=state.run;state.timer=setTimeout(()=>{if(token!==state.run||state.screen!=='battle')return;if(state.player.hp<=0||state.boss.hp<=0)finishBossBattle();else nextTurn();},1100/state.speed);
}

 if(state.player.hp<=0)showGameOver();else if(state.stage===4)showVictory();else showReward();
}

function showHelp(){
 showModal('遊玩指南','HOW TO PLAY',`<h3>一張職業卡，五場命運試煉。</h3><ol><li>選擇<strong>戰士、法師、刺客或聖騎士</strong>，獲得 ${INITIAL_AP} AP。</li><li>自行將 AP 用於 HP、ATK、DEF、CRIT 或 ULT；每次消耗 1 AP。</li><li>先判定<strong>成功或失敗</strong>，再隨機抽取增加值或損失值；失敗真的會扣能力。</li><li>成功提升該能力等級。等級越高，下次成功率越低；最高 Lv.6。失敗不降級。</li><li>準備好後挑戰 Boss。<strong>沒用完的 AP 會捨棄</strong>，不會累積。</li><li>戰鬥自動輪流進行，玩家先攻。先判定大招，未觸發才判定爆擊，再不觸發就是普攻。</li><li>普攻必定命中，固定傷害 <strong>max(1, ATK − DEF)</strong>。爆擊為普攻的 1.5 倍後四捨五入。</li><li>擊敗 Boss 後獲得 8、9、10、12 AP；進入下次強化時<strong>生命回滿</strong>，能力與等級保留。</li><li>連續擊敗五名 Boss 即勝利。任何一戰倒下，就要從第一關重新開始。</li><li>可切換 ×2 戰鬥速度。開啟說明視窗或切換分頁會暫停後續戰鬥回合。</li></ol><h3>冒險，也要有底線。</h3><p>HP 最低為職業初始生命的 50%；ATK ≥5、DEF ≥0、CRIT 介於 5%–60%、ULT 介於 10%–60%。每項最高 Lv.6。生命與能力保留一位小數；百分點成長也取一位小數，畫面與判定使用同一數值。</p><p>大招固定傷害：戰士 2.2×ATK − DEF；法師 2.6×ATK − 0.5×DEF；刺客兩次各 1.2×ATK − DEF；聖騎士 1.6×ATK − DEF 並回復 20% 最大生命。每擊至少 1 傷害，大招傷害逐擊四捨五入。Boss 大招為其普通傷害乘指定倍率。</p><p>沒有自動配點，也沒有單一標準答案。分散鍛造能避開低成功率，但最終 Boss 需要足夠的傷害與生存。每局約 5–8 分鐘，依決策時間與速度有所不同。重新整理頁面會開始新的旅程。</p>`);
}
function probabilityBody(){
 const key=state.probStat,m=STAT_META[key],lv=state.player?state.player.levels[key]:0,p=getEnhanceSuccessRate(lv),gain=m.gain,loss=m.loss;
 return `<h3>01 / 決定「會不會」 · Bernoulli</h3><p>強化、大招與爆擊各自做一次二元試驗。程式產生 r = Math.random()，只有 <strong>r &lt; p</strong> 時成功。</p><div class="formula">X ~ Bernoulli(p)<br>P(X = 1) = p &nbsp; · &nbsp; P(X = 0) = 1 − p<br>E[X] = p &nbsp; · &nbsp; Var(X) = p(1 − p)</div><div class="prob-levels">${[0,1,2,3,4,5].map(l=>`<div>Lv.${l} → ${l+1}<b>${percent(getEnhanceSuccessRate(l))}</b></div>`).join('')}</div><p>Lv.6 已達上限，不再進行強化實驗。失敗不降級，下次仍使用同一成功率。</p><h3>02 / 決定「多少」 · Uniform</h3><p>只有強化的增加值／損失值使用均勻分配；<strong>普通攻擊不抽取隨機傷害</strong>。</p><div class="formula">Y ~ U(a, b) &nbsp; · &nbsp; f(y) = 1 / (b − a), a ≤ y ≤ b<br>E[Y] = (a + b) / 2<br>Var(Y) = (b − a)² / 12</div><div class="stat-tabs" aria-label="查看能力範例">${STAT_KEYS.map(k=>`<button data-action="prob-stat" data-stat="${k}" class="${k===key?'active':''}" aria-pressed="${k===key}">${STAT_META[k].label}</button>`).join('')}</div><div class="math-example"><strong>${state.player?state.player.name+' · 目前':'初始範例 · '}${m.label} Lv.${lv}</strong><br>${lv===6?'MAX LEVEL · 已達最高等級':`下一次成功率 p = ${p.toFixed(2)}（${percent(p)}） · Var(X) = ${(p*(1-p)).toFixed(4)}`}<br>成功 G ~ U(${gain.join(', ')}) · E[G] = ${(gain[0]+gain[1])/2} · Var(G) = ${((gain[1]-gain[0])**2/12).toFixed(3)}<br>失敗 L ~ U(${loss.join(', ')}) · E[L] = ${(loss[0]+loss[1])/2} · Var(L) = ${((loss[1]-loss[0])**2/12).toFixed(3)}${['crit','ult'].includes(key)?'<br>以上成長與損失單位為「百分點」。':''}</div><p>實作為 a + Math.random() × (b − a)，抽樣後四捨五入到一位小數，再套用能力上下限。上面的平均與變異數描述原始連續分配；取整與截限後，實際能力變動可能略有不同。</p><h3>03 / 戰鬥的三種可能</h3><div class="formula">P(大招) = pULT<br>P(爆擊) = (1 − pULT) × pCRIT<br>P(普攻) = (1 − pULT) × (1 − pCRIT)</div>${state.player?`<p>目前 ULT = ${format(state.player.ult)}%、CRIT = ${format(state.player.crit)}%：每次行動的大招機率 ${percent(state.player.ult/100)}、爆擊機率 ${percent((1-state.player.ult/100)*state.player.crit/100)}、普通攻擊機率 ${percent((1-state.player.ult/100)*(1-state.player.crit/100))}。<strong>卡面 CRIT 是未觸發大招時的條件機率。</strong></p>`:'<p>例如 ULT 30%、CRIT 25%：大招 30%、爆擊 17.5%、普攻 52.5%。大招成功就不會進行爆擊試驗。</p>'}<h3>04 / 本局實驗紀錄 · 玩家</h3>${statisticsTable(state.stats)}<p>平均理論機率 = 各次判定 p 的總和 ÷ 判定次數。爆擊分母只包含實際執行爆擊判定的行動；大招觸發的行動不計入。沒有試驗時以「—」顯示。</p><h3>Boss 的獨立紀錄</h3>${statisticsTable(state.bossStats)}<p>Boss 與玩家使用相同順序，分開統計。有限樣本不保證等於期望；這正是每一局命運不同的原因。戰鬥紀錄保留最近 10 次行動，Roll 顯示六位小數，滑鼠停留可讀取完整原始值。</p>`;
}

function handleAction(event){
 const el=event.target.closest('[data-action]');if(!el||el.disabled)return;
 switch(el.dataset.action){
 case 'start':cancelRun();state.selected=null;go('select');break;
 case 'select':state.selected=el.dataset.id;renderSelect();app.querySelector(`[data-id="${state.selected}"]`).focus({preventScroll:true});break;
 case 'confirm-class':if(state.selected)startRun(state.selected);break;
 case 'enhance':performEnhancement(el.dataset.stat);break;
 case 'ready':if(!state.busy&&state.screen==='prep')confirmBattle();break;
 case 'enter-battle':closeModal();startBossBattle(state.stage);break;
 case 'speed':state.speed=state.speed===1?2:1;el.textContent=`×${state.speed} SPEED · ${state.speed===1?'加速':'正常'}`;el.setAttribute('aria-pressed',state.speed===2);break;
 case 'next-stage':if(state.screen==='reward'){state.ap=BOSSES[state.stage].reward;state.stage++;state.player.hp=state.player.maxHp;state.result=null;go('prep');}break;
 case 'retry':startRun(state.player.id);break;
 case 'change-class':cancelRun();state.selected=null;go('select');break;
 case 'home':if(['prep','battle','reward'].includes(state.screen))showModal('離開這場旅程？','RETURN TO TITLE','<p class="confirm-copy">返回首頁會失去本局進度。</p><p>可以關閉視窗，繼續目前的試煉。</p><div class="confirm-actions"><button class="btn" data-action="close-modal">繼續旅程</button><button class="btn btn-primary" data-action="confirm-home">返回首頁</button></div>');else{cancelRun();go('home');}break;
 case 'confirm-home':closeModal();cancelRun();go('home');break;
 case 'help':showHelp();break;
 case 'probability':showProbability();break;
 case 'prob-stat':state.probStat=el.dataset.stat;const scroll=modal.scrollTop;showProbability();modal.scrollTop=scroll;modal.querySelector(`[data-stat="${state.probStat}"]`).focus({preventScroll:true});break;
 case 'close-modal':closeModal();break;
 }
}
document.addEventListener('click',handleAction);
modal.addEventListener('click',event=>{if(event.target===modal){const r=modal.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.screen==='battle')clearTimeout(state.timer);else if(!document.hidden&&state.screen==='battle')scheduleTurn(350);});
// The shared pure rules are exposed for reproducible probability and balance tests.
window.FateForge=Object.freeze({CLASSES,BOSSES,STAT_META,STAT_KEYS,INITIAL_AP,clamp,round1,bernoulli,uniform,getEnhanceSuccessRate,makeCharacter,makeStats,enhanceCharacter,calculateNormalDamage,rollUltimate,rollCritical,performUltimate,performAttack});
renderHome();

})();
</script>
